# The entrypoint owns the shared-target lease. This body has one
# preapproval capture owner and one reviewed production consumer.
name: Release candidate

on:
  workflow_call:
    inputs:
      conditional_claim:
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Which components changed decides which release legs run. A change
  # touching only workflow files deploys nothing by itself; the same
  # push runs validation regardless.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      kb: ${{ steps.filter.outputs.kb }}
      infra: ${{ steps.filter.outputs.infra }}
      evaluation: ${{ steps.filter.outputs.evaluation }}
      power_platform: ${{ steps.filter.outputs.power_platform }}
      candidate_sha256: ${{ steps.filter.outputs.candidate_sha256 }}
    steps:
      - name: Refuse intentional releases off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "refusing an intentional release_app/release_kb dispatch off main:" >&2
          echo "  github.ref = ${{ github.ref }} (only refs/heads/main may release by hand)" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect which components changed
        id: filter
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$EVENT_BEFORE" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only "$base" HEAD || true)"
          echo "changed paths between $base and HEAD:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          app_changed=false
          kb_changed=false
          infra_changed=false
          pp_changed=false
          evaluation_changed=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              services/api/*|apps/web/*|contracts/*|Dockerfile|.dockerignore|Directory.Packages.props)
                app_changed=true ;;
              dotnet-tools.json|ItSupport.slnx)
                app_changed=true ;;
              eval/*)
                evaluation_changed=true ;;
              kb/*|services/ingest/*)
                kb_changed=true ;;
              infra/terraform/main/*)
                infra_changed=true ;;
              apps/power-platform/*)
                pp_changed=true ;;
            esac
          done <<EOF
          $changed
          EOF

          # An explicit release_app dispatch only ever adds the app
          # selection; it never falsifies what the paths changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
            [ "${{ github.event.inputs.release_app }}" = "true" ]; then
            app_changed=true
          fi

          # An explicit release_kb dispatch only ever adds the kb
          # selection; it never falsifies what the paths changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
            [ "${{ github.event.inputs.release_kb }}" = "true" ]; then
            kb_changed=true
          fi

          {
            echo "app=$app_changed"
            echo "kb=$kb_changed"
            echo "infra=$infra_changed"
            echo "power_platform=$pp_changed"
            echo "evaluation=$evaluation_changed"
          } >> "$GITHUB_OUTPUT"
          components=""
          [ "$app_changed" != true ] || components="$components app"
          [ "$kb_changed" != true ] || components="$components kb"
          [ "$infra_changed" != true ] || components="$components infra"
          [ "$pp_changed" != true ] || components="$components power_platform"
          [ "$evaluation_changed" != true ] || components="$components evaluation"
          candidate="$(python3 scripts/plan-evidence.py candidate --source "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --components $components)"
          echo "candidate_sha256=$candidate" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
      - run: uv sync --locked --project eval

      - name: Enforce the single release policy
        id: policy
        env:
          CONDITIONAL_CLAIM: ${{ inputs.conditional_claim }}
          APP: ${{ steps.filter.outputs.app }}
          KB: ${{ steps.filter.outputs.kb }}
          INFRA: ${{ steps.filter.outputs.infra }}
          PP: ${{ steps.filter.outputs.power_platform }}
          EVALUATION: ${{ steps.filter.outputs.evaluation }}
        run: |
          components=""
          [ "$APP" != true ] || components="$components app"
          [ "$KB" != true ] || components="$components kb"
          [ "$INFRA" != true ] || components="$components infra"
          [ "$PP" != true ] || components="$components power_platform"
          [ "$EVALUATION" != true ] || components="$components evaluation"
          if [ "$APP" != true ] && [ "$KB" != true ] && [ "$INFRA" != true ] && [ "$PP" != true ]; then
            # Empty or evaluation-only selection: the single conditional
            # policy promotes an app image, and none changed. This push
            # deploys nothing here; validation still runs, and every
            # forbidden component stays an explicit route rejection.
            echo "single release policy: no app component selected; nothing to promote"
            exit 0
          fi
          uv run --locked --project eval python eval/promote.py route \
            --claim "$CONDITIONAL_CLAIM" --components $components

  # The same CI that guards pull requests guards the release tip.
  validate:
    needs: changes
    uses: ./.github/workflows/ci.yml

  app-release:
    needs: [changes, validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  release-eval:
    needs: [changes, validate, app-release]
    if: >-
      always() && !failure() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.act &&
      needs.validate.result == 'success' && needs.app-release.result == 'success' &&
      needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # 2400s evaluation deadline (40 min) plus checkout, uv sync, az login
    # and post-run artifact upload.
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
    env:
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
      INDEX_NAME: ${{ vars.INDEX_NAME || 'kb' }}
      CHAT_DEPLOYMENT_NAME: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
      EMBEDDING_DEPLOYMENT_NAME: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
      SHARED_AI_ACCOUNT_KEY: ${{ secrets.SHARED_AI_ACCOUNT_KEY }}
      EVALUATION_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
      EXPECTED_APP_DIGEST: ${{ needs.app-release.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13
      - run: uv sync --locked --project services/ingest
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Evaluate the staging candidate
        id: evaluate
        run: |
          uv run --project services/ingest python eval/release.py --components app \
            --candidate evidence/candidate.json --output evidence/evaluation.json
          echo "passed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-evaluation
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 1

  release-summary:
    needs: [changes, app-release, release-eval]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.app-release.result == 'success' && needs.release-eval.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: release-evaluation
          path: evidence
      - name: Bind actual staging proofs to the release identity
        env:
          APP_DIGEST: ${{ needs.app-release.outputs.digest }}
          READINESS: ${{ needs.app-release.outputs.staging_readiness }}
          SMOKE: ${{ needs.app-release.outputs.staging_smoke }}
          BOT: ${{ needs.app-release.outputs.staging_e2e }}
          ASSETS: ${{ needs.app-release.outputs.staging_assets }}
          THEME: ${{ needs.app-release.outputs.staging_theme }}
        run: |
          [ "$READINESS" = true ] && [ "$SMOKE" = pass ] && [ "$BOT" = pass ] &&
            [ "$ASSETS" = pass ] && [ "$THEME" = pass ] || exit 1
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          candidate = json.loads(Path('evidence/candidate.json').read_bytes())
          if candidate['image'] != 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'] + '@' + os.environ['APP_DIGEST']:
              raise SystemExit('staging image binding differs')
          Path('release-identity.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'], 'image': candidate['image'],
              'component_status': {'power_platform': 'skipped_not_selected'},
              'staging_verification': {
                  key: os.environ[key] for key in ('READINESS', 'SMOKE', 'BOT', 'ASSETS', 'THEME')
              },
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-identity
          path: |
            release-identity.json
            evidence/*.json
          if-no-files-found: error

  approval-capture:
    needs: [changes, release-summary]
    if: >-
      always() && !failure() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.act &&
      needs.release-summary.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment: staging
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-identity
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
      - run: uv sync --locked --project services/ingest
      - name: Capture the complete approval bundle before review
        env:
          GH_TOKEN: ${{ github.token }}
          CONDITIONAL_CLAIM: ${{ inputs.conditional_claim }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          STAGING_PREFIX: ${{ vars.NAME_PREFIX }}
          PRODUCTION_PREFIX: ${{ vars.PRODUCTION_NAME_PREFIX }}
          STAGING_TICKETS_RESOURCE_ID: ${{ vars.STAGING_TICKETS_RESOURCE_ID }}
          PRODUCTION_TICKETS_RESOURCE_ID: ${{ vars.PRODUCTION_TICKETS_RESOURCE_ID }}
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          INDEX: ${{ vars.INDEX_NAME || 'kb' }}
          CHAT: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
          EMBEDDING: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
          PP: ${{ needs.changes.outputs.power_platform }}
          EVALUATION: ${{ needs.changes.outputs.evaluation }}
        run: |
          components="app"
          [ "$PP" != true ] || components="$components power_platform"
          [ "$EVALUATION" != true ] || components="$components evaluation"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = '/subscriptions/' + os.environ['SUBSCRIPTION'] + '/resourceGroups/'
          targets = {}
          for plane, key in (('staging', 'STAGING_PREFIX'), ('production', 'PRODUCTION_PREFIX')):
              prefix = os.environ[key]
              if not prefix:
                  raise SystemExit('explicit target prefix required')
              # Terraform names the search service '<prefix>-srch'. A shared
              # run consumes the owner's search service and AI account rather
              # than owning them, so the dependency owner is the shared prefix
              # for the staging plane and the plane prefix for the production
              # owner; the coalesce mirrors the declared state.
              owner = (os.environ['SHARED_PREFIX'] or prefix) if plane == 'staging' else prefix
              targets[plane] = {
                  'tenant_id': os.environ['TENANT'], 'subscription_id': os.environ['SUBSCRIPTION'],
                  'app_resource_id': root + prefix + '-rg/providers/Microsoft.App/containerApps/' + prefix + '-app',
                  'search_resource_id': (
                      root + owner + '-rg/providers/Microsoft.Search/searchServices/' + owner + '-srch'
                  ),
                  'ai_resource_id': (
                      root + owner + '-rg/providers/Microsoft.CognitiveServices/accounts/' + owner + '-ai'
                  ),
                  'tickets_resource_id': os.environ[plane.upper() + '_TICKETS_RESOURCE_ID'],
                  'index_name': os.environ['INDEX'], 'chat_deployment': os.environ['CHAT'],
                  'embedding_deployment': os.environ['EMBEDDING'],
              }
          Path('capture-targets.json').write_text(json.dumps(targets))
          PY
          uv run --locked --project services/ingest python eval/promote.py prepare --claim "$CONDITIONAL_CLAIM" \
            --targets capture-targets.json --components $components --output conditional-baseline
          {
            echo 'Conditional same-candidate policy: CURRENT evidence is reused without refresh.'
            echo 'Evidence expired solely by age permits at most one bounded refresh after this approval.'
            echo 'The original candidate and both staging and production dependencies' \
              'must remain unchanged; drift rejects.'
            echo 'Original envelope, candidate and evaluation bytes are immutable;' \
              'refreshed evidence is supplementary.'
            echo 'This approval never renews an infrastructure plan or authorizes KB,' \
              'infrastructure or active Power Platform writes.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-approval-bundle
          path: conditional-baseline/
          if-no-files-found: error
      - name: Publish exact review identities
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\nApproval bundle ID: ' + os.environ['ARTIFACT_ID'] + '\n')
              summary.write('Approval archive SHA256: ' + os.environ['ARTIFACT_DIGEST'] + '\n')
              for path in sorted(Path('conditional-baseline').rglob('*.json')):
                  summary.write(str(path.relative_to('conditional-baseline')) + ' SHA256: ' +
                                hashlib.sha256(path.read_bytes()).hexdigest() + '\n')
          PY

  conditional-production:
    needs: [changes, release-summary, approval-capture]
    if: >-
      always() && !failure() && !cancelled() &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.act &&
      needs.release-summary.result == 'success' && needs.approval-capture.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: demo
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      CONDITIONAL_ARTIFACT_ID: ${{ needs.approval-capture.outputs.artifact_id }}
      CONDITIONAL_ARTIFACT_DIGEST: ${{ needs.approval-capture.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-approval-bundle
          path: approved
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13
      - name: Verify same-run bytes and reviewed association before cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${CONDITIONAL_ARTIFACT_ID:?conditional baseline artifact required}"
          : "${CONDITIONAL_ARTIFACT_DIGEST:?conditional baseline digest required}"
          uv sync --locked --project services/ingest
          uv run --project services/ingest python eval/promote.py consume \
            --envelope approved/release-identity.json --candidate approved/evidence/candidate.json \
            --evaluation approved/evidence/evaluation.json --baseline approved/dependency-baseline.json \
            --artifact-id "$CONDITIONAL_ARTIFACT_ID" --artifact-digest "$CONDITIONAL_ARTIFACT_DIGEST"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Compare original dependencies and conditionally refresh once
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_ENVIRONMENT: demo
        run: |
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          uv sync --locked --project services/ingest
          uv run --project services/ingest python eval/promote.py promote \
            --envelope approved/release-identity.json --candidate approved/evidence/candidate.json \
            --evaluation approved/evidence/evaluation.json --baseline approved/dependency-baseline.json \
            --artifact-id "$CONDITIONAL_ARTIFACT_ID" --artifact-digest "$CONDITIONAL_ARTIFACT_DIGEST"
          echo 'updated=true' >> "$GITHUB_OUTPUT"
      - name: Wait for the approved image to answer /health
        id: readiness
        env:
          PRODUCTION_PREFIX: ${{ vars.PRODUCTION_NAME_PREFIX }}
        run: |
          : "${PRODUCTION_PREFIX:?the demo production plane must set PRODUCTION_NAME_PREFIX}"
          fqdn="$(az containerapp show --name "${PRODUCTION_PREFIX}-app" \
            --resource-group "${PRODUCTION_PREFIX}-rg" --query properties.configuration.ingress.fqdn -o tsv)"
          ready=false
          for _ in $(seq 1 30); do
            status="$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' \
              "https://$fqdn/health")"
            if [ "$status" = 200 ]; then
              ready=true
              break
            fi
            sleep 10
          done
          [ "$ready" = true ] || exit 1
      - name: Smoke the production HTTP surface
        id: smoke
        env:
          PRODUCTION_PREFIX: ${{ vars.PRODUCTION_NAME_PREFIX }}
        run: |
          fqdn="$(az containerapp show --name "${PRODUCTION_PREFIX}-app" \
            --resource-group "${PRODUCTION_PREFIX}-rg" --query properties.configuration.ingress.fqdn -o tsv)"
          curl --fail --silent --show-error --max-time 30 "https://$fqdn/" > /dev/null
          curl --fail --silent --show-error --max-time 30 "https://$fqdn/health" > /dev/null
      - name: Prove the production knowledge answer end to end
        id: bot
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          BOT_NAME: ${{ format('{0}-bot', vars.PRODUCTION_NAME_PREFIX) }}
          BOT_RESOURCE_GROUP: ${{ format('{0}-rg', vars.PRODUCTION_NAME_PREFIX) }}
          EXPECTED_CITATION: printer.md
        run: |
          bash scripts/verify-bot-conversation.sh
      - name: Record actual conditional production outcome
        if: always()
        env:
          ATTEMPTED: ${{ steps.promotion.outputs.attempted }}
          UPDATED: ${{ steps.promotion.outputs.updated }}
          PROMOTION: ${{ steps.promotion.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          BOT: ${{ steps.bot.outcome }}
        run: |
          outcome=not_attempted
          if [ "$ATTEMPTED" = true ]; then outcome=failed; fi
          if [ "$UPDATED" = true ]; then outcome=partial; fi
          if [ "$UPDATED" = true ] && [ "$READINESS" = success ] && \
             [ "$SMOKE" = success ] && [ "$BOT" = success ]; then outcome=succeeded; fi
          export CONDITIONAL_OUTCOME="$outcome"
          {
            echo "Conditional production: $outcome"
            echo "Promotion $PROMOTION; readiness $READINESS; HTTP $SMOKE; bot $BOT."
            echo 'A pre-write supplement is evaluation evidence, not proof of deployment success.'
            echo 'An unconfirmed update may have mutated production; failure does not prove it stayed unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p conditional-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          supplement_path = Path('conditional-evidence/supplement.json')
          if supplement_path.exists():
              supplement = json.loads(supplement_path.read_bytes())
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write(f"Latest evaluation SHA256: {supplement['result_sha256']}\n")
                  summary.write(f"Same-candidate refresh count: {supplement['refresh_count']}\n")
          Path('conditional-evidence/outcome.json').write_text(json.dumps({
              'schema': 'ConditionalProductionOutcomeV1',
              'outcome': os.environ['CONDITIONAL_OUTCOME'],
              'attempted': os.environ['ATTEMPTED'] == 'true',
              'updated': os.environ['UPDATED'] == 'true',
              'promotion': os.environ['PROMOTION'],
              'readiness': os.environ['READINESS'],
              'http_smoke': os.environ['SMOKE'],
              'bot': os.environ['BOT'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-promotion-supplement
          path: |
            conditional-evidence/result.json
            conditional-evidence/supplement.json
            conditional-evidence/outcome.json
          if-no-files-found: ignore
