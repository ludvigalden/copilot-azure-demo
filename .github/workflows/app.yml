name: App

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "contracts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Packages.props"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "contracts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Packages.props"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.ACT != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A local run builds the image but pushes nowhere: the build job has
      # no Azure identity and no registry credential to leak.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && env.ACT != 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: ${{ env.ACT != 'true' && 'type=gha' || '' }}
          cache-to: ${{ env.ACT != 'true' && 'type=gha,mode=max' || '' }}

  # Staging receives the new image first and answers for it before
  # production is pointed at the same digest.
  deploy-staging:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: app-staging-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        if: env.ACT != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The local loop signs in with a staging-scoped credential; the
      # deploy itself stays a plain CLI call against the staging app.
      - name: Sign in with the local staging credentials
        if: env.ACT == 'true'
        env:
          ACT_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ACT_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ACT_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          az login --service-principal \
            --username "$ACT_ARM_CLIENT_ID" \
            --password "$ACT_ARM_CLIENT_SECRET" \
            --tenant "$ACT_ARM_TENANT_ID" \
            --output none

      - name: Point the container app at the new image
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          az containerapp update \
            --name "${NAME_PREFIX}-app" \
            --resource-group "${NAME_PREFIX}-rg" \
            --image "$IMAGE"

  deploy:
    needs: deploy-staging
    if: ${{ github.event_name != 'pull_request' && !github.event.act }}
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: app-demo-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the container app at the new image
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          az containerapp update \
            --name "${NAME_PREFIX}-app" \
            --resource-group "${NAME_PREFIX}-rg" \
            --image "$IMAGE"
