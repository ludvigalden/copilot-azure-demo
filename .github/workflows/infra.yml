name: Infra

on:
  pull_request:
    paths:
      - "infra/terraform/main/**"
      - ".github/workflows/infra.yml"
  workflow_call:
    outputs:
      plan_hash:
        value: ${{ jobs.terraform-demo.outputs.plan_hash }}
      plan_saved:
        value: ${{ jobs.terraform-demo.outputs.plan_saved }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A pull request proves the configuration is well formed with no
  # cloud credential at all: no sign-in, no backend, no plan against
  # real resources.
  static-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/main
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise without the backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  # Staging plans and applies first: the same configuration proves
  # itself against its own resource group and state key before
  # production is planned at all. The release coordinator calls this
  # workflow; a manual dispatch replans as maintenance and stops at
  # the plan.
  terraform-staging:
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      # The group names the shared target, not the ref: two releases
      # touching the same staging resources must serialize.
      group: infra-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/main
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'main.tfstate' }}
      TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
      TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
      TF_VAR_index_name: ${{ vars.INDEX_NAME || 'kb' }}
      TF_VAR_chat_deployment_name: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
      TF_VAR_embedding_deployment_name: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
      TF_VAR_shared_ai_account_key: ${{ secrets.SHARED_AI_ACCOUNT_KEY }}
      TF_VAR_cd_principal_object_id: ${{ vars.CD_PRINCIPAL_OBJECT_ID }}
      TF_VAR_owner_principal_object_id: ${{ vars.OWNER_PRINCIPAL_OBJECT_ID }}
      TF_VAR_act_principal_object_id: ${{ vars.ACT_PRINCIPAL_OBJECT_ID }}
      TF_VAR_extra_redirect_uris: ${{ vars.EXTRA_REDIRECT_URIS || '[]' }}
    steps:
      - uses: actions/checkout@v7

      # Environment-scoped variables resolve only inside jobs carrying
      # the environment, so the bindings are proven at step time and
      # the job fails loudly rather than initialising a wrong or empty
      # backend.
      - name: Require the staging bindings
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
        run: |
          : "${ARM_CLIENT_ID:?the staging environment must set AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?the staging environment must set AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?the staging environment must set AZURE_SUBSCRIPTION_ID}"
          : "${TFSTATE_RESOURCE_GROUP:?the staging environment must set TFSTATE_RESOURCE_GROUP}"
          : "${TFSTATE_STORAGE_ACCOUNT:?the staging environment must set TFSTATE_STORAGE_ACCOUNT}"
          : "${TF_VAR_prefix:?the staging environment must set NAME_PREFIX}"
          : "${TF_VAR_shared_prefix:?the staging environment must set SHARED_PREFIX}"

      - uses: azure/login@v2
        if: env.ACT != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Under the local runner the workstation's service principal
      # from .env.local signs in instead of OIDC.
      - name: Sign in with the local staging credentials
        if: env.ACT == 'true'
        env:
          ACT_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ACT_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ACT_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ACT_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        run: |
          command -v az >/dev/null 2>&1 || curl -sL https://aka.ms/InstallAzureCLIDeb | bash > /dev/null
          az login --service-principal \
            --username "$ACT_ARM_CLIENT_ID" \
            --password "$ACT_ARM_CLIENT_SECRET" \
            --tenant "$ACT_ARM_TENANT_ID" \
            --output none
          az account set --subscription "$ACT_ARM_SUBSCRIPTION_ID" --output none
          {
            echo "ARM_USE_OIDC=false"
            echo "ARM_CLIENT_ID=$ACT_ARM_CLIENT_ID"
            echo "ARM_CLIENT_SECRET=$ACT_ARM_CLIENT_SECRET"
            echo "ARM_TENANT_ID=$ACT_ARM_TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$ACT_ARM_SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise
        run: |
          oidc_flag=""
          if [ "$ACT" != "true" ]; then
            oidc_flag="-backend-config=use_oidc=true"
          fi
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="key=$TFSTATE_KEY" \
            $oidc_flag

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      # Only the release coordinator applies staging; a pull request
      # never reaches this job, and a local run stops at the plan.
      - name: Apply
        if: github.event_name == 'workflow_call' && env.ACT != 'true'
        run: terraform apply -input=false -auto-approve tfplan

  # Production is planned by a trusted job and applied later by the
  # release coordinator from the saved plan — never from a plan
  # re-computed at apply time. Planning reads production bindings, so
  # this job already sits behind the demo environment's approval; the
  # release adds its own gate in front of the apply.
  terraform-demo:
    needs: terraform-staging
    if: (github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch') && !github.event.act
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-demo
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/main
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'main.tfstate' }}
      TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
      TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
      TF_VAR_index_name: ${{ vars.INDEX_NAME || 'kb' }}
      TF_VAR_chat_deployment_name: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
      TF_VAR_embedding_deployment_name: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
      TF_VAR_shared_ai_account_key: ${{ secrets.SHARED_AI_ACCOUNT_KEY }}
      TF_VAR_cd_principal_object_id: ${{ vars.CD_PRINCIPAL_OBJECT_ID }}
      TF_VAR_owner_principal_object_id: ${{ vars.OWNER_PRINCIPAL_OBJECT_ID }}
      TF_VAR_act_principal_object_id: ${{ vars.ACT_PRINCIPAL_OBJECT_ID }}
      TF_VAR_extra_redirect_uris: ${{ vars.EXTRA_REDIRECT_URIS || '[]' }}
      TF_VAR_public_hostname: ${{ secrets.PUBLIC_HOSTNAME || '' }}
    outputs:
      plan_hash: ${{ steps.plan.outputs.plan_hash }}
      plan_saved: ${{ steps.save.outputs.saved }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the production bindings
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
          TF_VAR_public_hostname: ${{ secrets.PUBLIC_HOSTNAME || '' }}
        run: |
          : "${ARM_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"
          : "${TFSTATE_RESOURCE_GROUP:?the demo environment must set TFSTATE_RESOURCE_GROUP}"
          : "${TFSTATE_STORAGE_ACCOUNT:?the demo environment must set TFSTATE_STORAGE_ACCOUNT}"
          : "${TF_VAR_prefix:?the demo environment must set NAME_PREFIX}"
          : "${TF_VAR_shared_prefix:?the demo environment must set SHARED_PREFIX}"
          # An empty hostname drops the custom-domain resources from
          # the plan and would drift-destroy them at apply; refuse to
          # plan against production without it.
          : "${TF_VAR_public_hostname:?the demo environment must set the PUBLIC_HOSTNAME secret}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialise
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan
          # Sensitive values collapse to "(sensitive value)" in the
          # rendered plan; the summary carries no cleartext.
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          plan_hash="$(sha256sum tfplan | cut -d' ' -f1)"
          echo "plan_hash=$plan_hash" >> "$GITHUB_OUTPUT"

      # The plan is saved into the same private storage account the
      # state already lives in — not into a workflow artifact, which a
      # public repository exposes anonymously and a plan file can
      # carry cleartext. The runner's OIDC identity already holds
      # Storage Blob Data Contributor on this container; storage
      # encrypts at rest; the fixed blob name lets the next release
      # replace a stale plan.
      - name: Save the plan for the approved apply
        id: save
        if: github.event_name == 'workflow_call'
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name tfstate \
            --name tfplans/demo.tfplan \
            --file tfplan \
            --overwrite
          echo "saved=true" >> "$GITHUB_OUTPUT"
