# Thin entrypoint wrapper: pull-request checks and manual plans enter
# here, under one shared-target lease for the whole run. The reusable
# body carries no concurrency and no event triggers of its own.
name: Infra

on:
  pull_request:
    paths:
      - "infra/terraform/main/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/infra-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One writer to the shared demo target at a time: a manual plan waits
  # out an in-flight release of any component, and two plans never race
  # for the same state lock. Queued plans are replaced, not durable.
  group: shared-target-demo
  cancel-in-progress: false

jobs:
  infra:
    uses: ./.github/workflows/infra-candidate.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
