name: Ingest

on:
  pull_request:
    paths:
      - "kb/**"
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  workflow_call:
    outputs:
      kb_commit:
        value: ${{ jobs.staging-check.outputs.kb_commit }}
      index_name:
        value: ${{ jobs.staging-check.outputs.index_name }}
      doc_count:
        value: ${{ jobs.staging-check.outputs.doc_count }}

permissions:
  contents: read

concurrency:
  # Ingestion converges an index over many batches; a second run racing
  # the first can interleave documents mid-merge. Overlapping runs
  # therefore queue instead of cancelling: a cancelled run can leave the
  # index half converged, and a half-converged index is worse than a
  # late one.
  group: ingest
  cancel-in-progress: false

jobs:
  validate-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13

      - name: Validate the knowledge base against the locked tool
        run: |
          uv sync --locked --project services/ingest
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --dry-run

  # Staging is filled before production in every path that writes at
  # all. On pull requests nothing writes: this job is skipped and the
  # run stays a pure validation.
  push-staging:
    needs: validate-kb
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ingest-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Require the staging bindings
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${SHARED_PREFIX:?the staging environment must set SHARED_PREFIX}"
          : "${AZURE_CLIENT_ID:?the staging environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the staging environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the staging environment must set AZURE_SUBSCRIPTION_ID}"

      # On Actions the staging environment's OIDC federated credential
      # signs in. Locally (under act) the workstation's service
      # principal from .env.local signs in instead.
      - uses: azure/login@v2
        if: env.ACT != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Azure CLI (local runs)
        if: env.ACT == 'true'
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - name: Sign in with the workstation principal (local runs)
        if: env.ACT == 'true'
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" >/dev/null

      - name: Fill the staging index
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
          EMBEDDING_DEPLOYMENT_NAME: ${{ vars.EMBEDDING_DEPLOYMENT_NAME }}
        run: |
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --search-endpoint "https://${SHARED_PREFIX}-srch.search.windows.net" \
            --openai-endpoint "https://${SHARED_PREFIX}-ai.cognitiveservices.azure.com/" \
            --index-name "${INDEX_NAME:-kb}" \
            --embedding-deployment "${EMBEDDING_DEPLOYMENT_NAME:-embedding}"

  # The release path's retrieval check: prove the staging index
  # actually serves documents, and record which knowledge-base commit
  # produced them. This is the evidence the release summary reports.
  staging-check:
    needs: push-staging
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      kb_commit: ${{ steps.kb.outputs.commit }}
      index_name: ${{ steps.count.outputs.index_name }}
      doc_count: ${{ steps.count.outputs.doc_count }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the staging bindings
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${SHARED_PREFIX:?the staging environment must set SHARED_PREFIX}"
          : "${AZURE_CLIENT_ID:?the staging environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the staging environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the staging environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Count the documents the staging index serves
        id: count
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
        run: |
          index_name="${INDEX_NAME:-kb}"
          url="$(printf 'https://%s-srch.search.windows.net/indexes(%s)/docs/$count?api-version=2024-07-01' \
            "$SHARED_PREFIX" "$index_name")"
          count="$(az rest --method GET \
            --url "$url" \
            --resource https://search.azure.com \
            --output tsv)"
          count="${count//\"/}"
          case "$count" in
            ''|*[!0-9]*)
              echo "unexpected document-count response for '$index_name': $count" >&2
              exit 1
              ;;
          esac
          if [ "$count" -eq 0 ]; then
            echo "the staging index '$index_name' serves no documents" >&2
            exit 1
          fi
          echo "index_name=$index_name" >> "$GITHUB_OUTPUT"
          echo "doc_count=$count" >> "$GITHUB_OUTPUT"

      - name: Record which knowledge-base commit is active
        id: kb
        run: |
          commit="$(git log -1 --format=%h -- kb/)"
          : "${commit:?no knowledge-base commit recorded}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # Production ingestion stays a scheduled operation in this workflow.
  # The release path's production write is release.yml's
  # ingest-production job: the same command, under the demo
  # environment's approval gate, serialized through the same
  # concurrency group. A manual workflow_dispatch fills staging only.
  push:
    needs: [validate-kb, push-staging]
    if: github.event_name == 'schedule' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the demo bindings
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${NAME_PREFIX:?the demo environment must set NAME_PREFIX}"
          : "${AZURE_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fill the production index
        run: |
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --prefix "${{ vars.NAME_PREFIX }}"
