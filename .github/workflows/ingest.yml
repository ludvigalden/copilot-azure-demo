name: Ingest

on:
  push:
    branches: [main]
    paths:
      - "kb/**"
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"
  pull_request:
    paths:
      - "kb/**"
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"
  schedule:
    # Weekly; keeps the knowledge base fresh and the search service active.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Chunk and validate the knowledge base
        run: uv run --project services/ingest ingest --kb kb --repo "$GITHUB_REPOSITORY" --dry-run
