# Thin entrypoint wrapper: pull-request validation, the weekly
# production fill and manual runs enter here, under one shared-target
# lease for the whole run. The reusable body carries no concurrency.
name: Ingest

on:
  pull_request:
    paths:
      - "kb/**"
      - "services/ingest/**"
      - ".github/workflows/ingest.yml"
      - ".github/workflows/ingest-candidate.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Active ingestion is never cancelled: a second run waits, and
  # GitHub replaces a pending run rather than queueing requests. The
  # group names the shared demo target, so the weekly fill and a
  # release's production legs cannot overlap.
  group: shared-target-demo
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/ingest-candidate.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
