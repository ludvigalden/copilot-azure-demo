# Reusable-only body of the Ingest entrypoint: workflow_call, no
# triggers and no concurrency of its own — the old workflow-level
# ingest group is gone. The entrypoint owns the one shared-target
# lease for every trigger, including pull requests.
name: Ingest candidate

on:
  workflow_call:
    inputs:
      release_candidate:
        type: boolean
        default: false
    outputs:
      kb_commit:
        value: ${{ jobs.staging-check.outputs.kb_commit }}
      index_name:
        value: ${{ jobs.staging-check.outputs.index_name }}
      doc_count:
        value: ${{ jobs.staging-check.outputs.doc_count }}

permissions:
  contents: read

jobs:
  validate-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13

      - name: Validate the knowledge base against the locked tool
        run: |
          uv sync --locked --project services/ingest
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --dry-run

  # Staging is filled before production in every path that writes at
  # all. On pull requests nothing writes: this job is skipped and the
  # run stays a pure validation.
  push-staging:
    needs: validate-kb
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (inputs.release_candidate ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ingest-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Require the staging bindings
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${SHARED_PREFIX:?the staging environment must set SHARED_PREFIX}"
          : "${AZURE_CLIENT_ID:?the staging environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the staging environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the staging environment must set AZURE_SUBSCRIPTION_ID}"

      # On Actions the staging environment's OIDC federated credential
      # signs in. Locally (under act) the workstation's service
      # principal from .env.local signs in instead.
      - uses: azure/login@v2
        if: env.ACT != 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Azure CLI (local runs)
        if: env.ACT == 'true'
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - name: Sign in with the workstation principal (local runs)
        if: env.ACT == 'true'
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" >/dev/null

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13

      - name: Sync the locked ingestion tool
        run: uv sync --locked --project services/ingest

      - name: Fill the staging index
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
          EMBEDDING_DEPLOYMENT_NAME: ${{ vars.EMBEDDING_DEPLOYMENT_NAME }}
        run: |
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --search-endpoint "https://${SHARED_PREFIX}-srch.search.windows.net" \
            --openai-endpoint "https://${SHARED_PREFIX}-ai.cognitiveservices.azure.com/" \
            --index-name "${INDEX_NAME:-kb}" \
            --embedding-deployment "${EMBEDDING_DEPLOYMENT_NAME:-embedding}"

  # The release path's retrieval check: prove the staging index
  # actually serves documents, and record which knowledge-base commit
  # produced them. This is the evidence the release summary reports.
  staging-check:
    needs: push-staging
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (inputs.release_candidate ||
      github.event_name == 'schedule') && !github.event.act
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      kb_commit: ${{ steps.kb.outputs.commit }}
      index_name: ${{ steps.count.outputs.index_name }}
      doc_count: ${{ steps.count.outputs.doc_count }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the staging bindings
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${SHARED_PREFIX:?the staging environment must set SHARED_PREFIX}"
          : "${AZURE_CLIENT_ID:?the staging environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the staging environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the staging environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Count the documents the staging index serves
        id: count
        env:
          SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
          INDEX_NAME: ${{ vars.INDEX_NAME }}
        run: |
          index_name="${INDEX_NAME:-kb}"
          url="$(printf 'https://%s-srch.search.windows.net/indexes(%s)/docs/$count?api-version=2024-07-01' \
            "$SHARED_PREFIX" "$index_name")"
          count="$(az rest --method GET \
            --url "$url" \
            --resource https://search.azure.com \
            --output tsv)"
          count="${count//\"/}"
          case "$count" in
            ''|*[!0-9]*)
              echo "unexpected document-count response for '$index_name': $count" >&2
              exit 1
              ;;
          esac
          if [ "$count" -eq 0 ]; then
            echo "the staging index '$index_name' serves no documents" >&2
            exit 1
          fi
          echo "index_name=$index_name" >> "$GITHUB_OUTPUT"
          echo "doc_count=$count" >> "$GITHUB_OUTPUT"

      - name: Record which knowledge-base commit is active
        id: kb
        run: |
          commit="$GITHUB_SHA"
          : "${commit:?no knowledge-base commit recorded}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  scheduled-eval:
    needs: staging-check
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !github.event.act
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      SHARED_PREFIX: ${{ vars.SHARED_PREFIX }}
      INDEX_NAME: ${{ vars.INDEX_NAME || 'kb' }}
      CHAT_DEPLOYMENT_NAME: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
      EMBEDDING_DEPLOYMENT_NAME: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
      SHARED_AI_ACCOUNT_KEY: ${{ secrets.SHARED_AI_ACCOUNT_KEY }}
      EVALUATION_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13
      - run: uv sync --locked --project services/ingest
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Evaluate all golden questions against staging
        run: |
          uv run --project services/ingest python eval/release.py --components kb \
            --candidate evidence/candidate.json --output evidence/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-evaluation
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 1

  # Production ingestion stays a scheduled operation in this workflow.
  push:
    needs: [validate-kb, push-staging, scheduled-eval]
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the demo bindings
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${NAME_PREFIX:?the demo environment must set NAME_PREFIX}"
          : "${AZURE_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13

      - name: Sync the locked ingestion tool
        run: uv sync --locked --project services/ingest

      - uses: actions/download-artifact@v4
        with:
          name: scheduled-evaluation
          path: evidence

      - name: Recheck approved evaluation freshness
        env:
          EVALUATION_RUN_ID: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          uv run --project services/ingest python eval/release.py --verify-only \
            --components kb --candidate evidence/candidate.json --output evidence/evaluation.json

      - name: Fill the production index
        run: |
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --prefix "${{ vars.NAME_PREFIX }}"
