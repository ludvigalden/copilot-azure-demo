name: Release

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "contracts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Packages.props"
      - "dotnet-tools.json"
      - "ItSupport.slnx"
      - "kb/**"
      - "services/ingest/**"
      - "infra/terraform/main/**"
      - "apps/power-platform/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release_app:
        description: 'Intentionally release the app component from this ref'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One release at a time, end to end: the build, the staging
  # verification, the summary, and the production legs never race
  # another release for the same environments.
  group: release-demo
  cancel-in-progress: false

jobs:
  # Which components changed decides which release legs run. A change
  # touching only workflow files deploys nothing by itself; the same
  # push runs validation regardless.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      kb: ${{ steps.filter.outputs.kb }}
      infra: ${{ steps.filter.outputs.infra }}
      power_platform: ${{ steps.filter.outputs.power_platform }}
    steps:
      - name: Refuse intentional releases off main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "refusing an intentional release_app dispatch off main:" >&2
          echo "  github.ref = ${{ github.ref }} (only refs/heads/main may release by hand)" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect which components changed
        id: filter
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$EVENT_BEFORE" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only "$base" HEAD || true)"
          echo "changed paths between $base and HEAD:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          app_changed=false
          kb_changed=false
          infra_changed=false
          pp_changed=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              services/api/*|apps/web/*|contracts/*|Dockerfile|.dockerignore|Directory.Packages.props)
                app_changed=true ;;
              dotnet-tools.json|ItSupport.slnx)
                app_changed=true ;;
              kb/*|services/ingest/*)
                kb_changed=true ;;
              infra/terraform/main/*)
                infra_changed=true ;;
              apps/power-platform/*)
                pp_changed=true ;;
            esac
          done <<EOF
          $changed
          EOF

          # An explicit release_app dispatch only ever adds the app
          # selection; it never falsifies what the paths changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
            [ "${{ github.event.inputs.release_app }}" = "true" ]; then
            app_changed=true
          fi

          {
            echo "app=$app_changed"
            echo "kb=$kb_changed"
            echo "infra=$infra_changed"
            echo "power_platform=$pp_changed"
          } >> "$GITHUB_OUTPUT"

  # The same CI that guards pull requests guards the release tip.
  validate:
    needs: changes
    uses: ./.github/workflows/ci.yml

  app-release:
    needs: [changes, validate]
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit

  ingest-release:
    needs: [changes, validate]
    if: needs.changes.outputs.kb == 'true'
    uses: ./.github/workflows/ingest.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  infra-release:
    needs: [changes, validate]
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  pp-release:
    needs: [changes, validate]
    if: needs.changes.outputs.power_platform == 'true'
    uses: ./.github/workflows/power-platform.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # The release identity: everything the reviewer should see before
  # approving production — the exact image digest, the knowledge-base
  # commit the retrieval check proved, the infrastructure plan hash,
  # and the solution version — as a machine-readable manifest and a
  # run summary. Runs when at least one release component is selected:
  # a workflow-only push leaves nothing to summarize, so the run stays
  # green as validation-only with no artifact. A failed component still
  # fails it, and a selected component missing its evidence fails it
  # closed before anything is written.
  release-summary:
    needs: [changes, validate, app-release, ingest-release, infra-release, pp-release]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.kb == 'true' ||
       needs.changes.outputs.infra == 'true' ||
       needs.changes.outputs.power_platform == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Fail closed when a selected component reached the summary
      # without its evidence. The production apply itself stays behind
      # the demo environment's approval; here the recorded plan and its
      # saved state are the infrastructure evidence.
      - name: Assert the selected components carried their evidence
        env:
          APP_SELECTED: ${{ needs.changes.outputs.app }}
          KB_SELECTED: ${{ needs.changes.outputs.kb }}
          INFRA_SELECTED: ${{ needs.changes.outputs.infra }}
          PP_SELECTED: ${{ needs.changes.outputs.power_platform }}
          APP_DIGEST: ${{ needs.app-release.outputs.digest }}
          STAGING_READINESS: ${{ needs.app-release.outputs.staging_readiness }}
          STAGING_SMOKE: ${{ needs.app-release.outputs.staging_smoke }}
          STAGING_E2E: ${{ needs.app-release.outputs.staging_e2e }}
          KB_COMMIT: ${{ needs.ingest-release.outputs.kb_commit }}
          DOC_COUNT: ${{ needs.ingest-release.outputs.doc_count }}
          PLAN_HASH: ${{ needs.infra-release.outputs.plan_hash }}
          PLAN_SAVED: ${{ needs.infra-release.outputs.plan_saved }}
          SOLUTION_VERSION: ${{ needs.pp-release.outputs.solution_version }}
          PP_STAGING_STATUS: ${{ needs.pp-release.outputs.staging_status }}
        run: |
          fail() {
            echo "release gate: $1" >&2
            exit 1
          }
          if [ "$APP_SELECTED" = "true" ]; then
            [ -n "$APP_DIGEST" ] || fail "app selected but the release carries no image digest"
            [ "$STAGING_READINESS" = "true" ] || fail "app selected but staging readiness was not recorded ready"
            [ "$STAGING_SMOKE" = "pass" ] || fail "app selected but the staging smoke check did not pass"
            [ "$STAGING_E2E" = "pass" ] || fail "app selected but the staging bot end-to-end check did not pass"
          fi
          if [ "$KB_SELECTED" = "true" ]; then
            [ -n "$KB_COMMIT" ] || fail "knowledge base selected but its source commit was not recorded"
            [ -n "$DOC_COUNT" ] || fail "knowledge base selected but its document count was not recorded"
          fi
          if [ "$INFRA_SELECTED" = "true" ]; then
            [ -n "$PLAN_HASH" ] || fail "infrastructure selected but the plan hash was not recorded"
            [ "$PLAN_SAVED" = "true" ] || fail "infrastructure selected but the saved plan was not recorded"
          fi
          if [ "$PP_SELECTED" = "true" ]; then
            if [ -z "$SOLUTION_VERSION" ] && [ "$PP_STAGING_STATUS" != "not_configured" ]; then
              fail "power platform selected but neither a solution version nor a not-configured marker was recorded"
            fi
          fi
          echo "release gate: every selected component carried its release evidence"

      - name: Write the release identity
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          APP_DIGEST: ${{ needs.app-release.outputs.digest }}
          KB_COMMIT: ${{ needs.ingest-release.outputs.kb_commit }}
          INDEX_NAME: ${{ needs.ingest-release.outputs.index_name }}
          DOC_COUNT: ${{ needs.ingest-release.outputs.doc_count }}
          PLAN_HASH: ${{ needs.infra-release.outputs.plan_hash }}
          SOLUTION_VERSION: ${{ needs.pp-release.outputs.solution_version }}
          CHAT_DEPLOYMENT_NAME: ${{ vars.CHAT_DEPLOYMENT_NAME }}
          EMBEDDING_DEPLOYMENT_NAME: ${{ vars.EMBEDDING_DEPLOYMENT_NAME }}
          STAGING_READINESS: ${{ needs.app-release.outputs.staging_readiness }}
          STAGING_SMOKE: ${{ needs.app-release.outputs.staging_smoke }}
          STAGING_E2E: ${{ needs.app-release.outputs.staging_e2e }}
          APP_SELECTED: ${{ needs.changes.outputs.app }}
          KB_SELECTED: ${{ needs.changes.outputs.kb }}
          INFRA_SELECTED: ${{ needs.changes.outputs.infra }}
          PP_SELECTED: ${{ needs.changes.outputs.power_platform }}
          PP_STAGING_STATUS: ${{ needs.pp-release.outputs.staging_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          RELEASE_APP_SELECTED: ${{ github.event.inputs.release_app }}
        run: |
          image_value=""
          if [ -n "$APP_DIGEST" ]; then
            image_value="${IMAGE_REPO}@sha256:${APP_DIGEST}"
          fi
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg image "$image_value" \
            --arg kb_commit "$KB_COMMIT" \
            --arg index_name "$INDEX_NAME" \
            --arg doc_count "$DOC_COUNT" \
            --arg infra_plan_sha256 "$PLAN_HASH" \
            --arg solution_version "$SOLUTION_VERSION" \
            --arg chat_deployment "${CHAT_DEPLOYMENT_NAME:-chat}" \
            --arg embedding_deployment "${EMBEDDING_DEPLOYMENT_NAME:-embedding}" \
            --arg staging_readiness "$STAGING_READINESS" \
            --arg staging_smoke "$STAGING_SMOKE" \
            --arg staging_e2e "$STAGING_E2E" \
            --arg run_url "$RUN_URL" \
            --arg trigger "$TRIGGER" \
            --arg release_app_selected "$RELEASE_APP_SELECTED" \
            --arg app_selected "$APP_SELECTED" \
            --arg kb_selected "$KB_SELECTED" \
            --arg infra_selected "$INFRA_SELECTED" \
            --arg pp_selected "$PP_SELECTED" \
            '{
              source_commit: $source_commit,
              image: (if $image == "" then null else $image end),
              knowledge_base_commit: (if $kb_commit == "" then null else $kb_commit end),
              index_name: (if $index_name == "" then null else $index_name end),
              document_count: (if $doc_count == "" then null else ($doc_count | tonumber) end),
              infrastructure_plan_sha256: (if $infra_plan_sha256 == "" then null else $infra_plan_sha256 end),
              power_platform_solution_version: (if $solution_version == "" then null else $solution_version end),
              model_deployments: {chat: $chat_deployment, embedding: $embedding_deployment},
              staging_verification: {
                readiness: (if $staging_readiness == "" then null else $staging_readiness end),
                smoke: (if $staging_smoke == "" then null else $staging_smoke end),
                bot_end_to_end: (if $staging_e2e == "" then null else $staging_e2e end)
              },
              selected_components: [
                (if $app_selected == "true" then "app" else empty end),
                (if $kb_selected == "true" then "kb" else empty end),
                (if $infra_selected == "true" then "infra" else empty end),
                (if $pp_selected == "true" then "power_platform" else empty end)
              ],
              component_status: {
                app: (if $app_selected == "true" then "released" else "skipped_not_selected" end),
                knowledge_base: (if $kb_selected == "true" then "released" else "skipped_not_selected" end),
                infrastructure: (if $infra_selected == "true" then "released" else "skipped_not_selected" end),
                power_platform: (
                  if $pp_selected != "true" then "skipped_not_selected"
                  elif $solution_version != "" then "released"
                  else "skipped_not_configured" end)
              },
              trigger: $trigger,
              selection_source: (if $release_app_selected == "true" then "dispatch_input" else "push_paths" end),
              run_url: $run_url
            }' > release-identity.json
          cat release-identity.json

          {
            echo "## Release identity"
            echo ""
            echo "- Source commit: $SOURCE_COMMIT"
            if [ -n "$image_value" ]; then
              echo "- Image: $image_value"
            fi
            if [ -n "$KB_COMMIT" ]; then
              echo "- Knowledge base commit: $KB_COMMIT"
            fi
            if [ -n "$INDEX_NAME" ]; then
              echo "- Index: $INDEX_NAME serving $DOC_COUNT documents"
            fi
            if [ -n "$PLAN_HASH" ]; then
              echo "- Infrastructure plan sha256: $PLAN_HASH"
            fi
            if [ -n "$SOLUTION_VERSION" ]; then
              echo "- Power Platform solution version: $SOLUTION_VERSION"
            fi
            echo "- Model deployments: chat ${CHAT_DEPLOYMENT_NAME:-chat}," \
              "embedding ${EMBEDDING_DEPLOYMENT_NAME:-embedding}"
            echo "- Selected components: app $APP_SELECTED, kb $KB_SELECTED," \
              "infra $INFRA_SELECTED, power_platform $PP_SELECTED"
            if [ "$RELEASE_APP_SELECTED" = "true" ]; then
              echo "- Trigger: workflow_dispatch; selection source: dispatch_input (intentional release)"
            else
              echo "- Trigger: $TRIGGER; selection source: push_paths"
            fi
            if [ "$PP_SELECTED" = "true" ] && [ "$PP_STAGING_STATUS" = "not_configured" ]; then
              echo "- Power Platform: no staging environment configured; import skipped"
            fi
            if [ -n "$STAGING_E2E" ]; then
              echo "- Staging verification: readiness $STAGING_READINESS," \
                "smoke $STAGING_SMOKE, bot end-to-end $STAGING_E2E"
            fi
            echo ""
            echo "Production legs below run only after the demo environment's required reviewer approves;" \
              "the reviewer sees this summary first."
            echo ""
            echo "Honest limits: the AI evaluation suite is not part of the release path" \
              "- retrieval is proven by the staging citation check." \
              "Staging images are built by CI; a locally built staging image" \
              "remains an open gap documented in docs/local-loop.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-identity
          path: release-identity.json
          if-no-files-found: error

  # Production receives exactly the digest staging verified. The job
  # waits on the demo environment's required reviewer, who has seen
  # the release identity above.
  deploy-production:
    needs: [release-summary, app-release]
    if: needs.release-summary.result == 'success' && needs.app-release.result == 'success' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the demo bindings
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${NAME_PREFIX:?the demo environment must set NAME_PREFIX}"
          : "${AZURE_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Point the production container app at the approved digest
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          APP_DIGEST: ${{ needs.app-release.outputs.digest }}
        run: |
          : "${APP_DIGEST:?the release carried no image digest}"
          az containerapp update \
            --name "${NAME_PREFIX}-app" \
            --resource-group "${NAME_PREFIX}-rg" \
            --image "ghcr.io/${{ github.repository }}@sha256:${APP_DIGEST}"

      - name: Wait for the new image to answer /health
        id: readiness
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
        run: |
          fqdn="$(az containerapp show \
            --name "${NAME_PREFIX}-app" \
            --resource-group "${NAME_PREFIX}-rg" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          url="https://$fqdn/health"
          ready=false
          status=000
          for _ in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$status" = "200" ]; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "production /health never answered 200 within the polling window (last status $status)" >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Smoke the HTTP surface
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
        run: |
          fqdn="$(az containerapp show \
            --name "${NAME_PREFIX}-app" \
            --resource-group "${NAME_PREFIX}-rg" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          curl --fail --silent --show-error "https://$fqdn/" > /dev/null
          curl --fail --silent --show-error "https://$fqdn/health" > /dev/null

      - name: Prove the knowledge answer end to end
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          BOT_NAME: ${{ format('{0}-bot', vars.NAME_PREFIX) }}
          BOT_RESOURCE_GROUP: ${{ format('{0}-rg', vars.NAME_PREFIX) }}
          EXPECTED_CITATION: printer.md
        run: |
          sh scripts/verify-bot-conversation.sh

  # The apply leg: the exact plan the release planned and saved —
  # downloaded from the private state storage, hash-checked against
  # the plan hash in the release identity, applied under the demo
  # environment's approval, then deleted whether the apply passed or
  # failed.
  infra-apply:
    needs: [release-summary, infra-release]
    if: needs.release-summary.result == 'success' && needs.infra-release.result == 'success' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-demo
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/main
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY || 'main.tfstate' }}
      TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
      TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
      TF_VAR_index_name: ${{ vars.INDEX_NAME || 'kb' }}
      TF_VAR_chat_deployment_name: ${{ vars.CHAT_DEPLOYMENT_NAME || 'chat' }}
      TF_VAR_embedding_deployment_name: ${{ vars.EMBEDDING_DEPLOYMENT_NAME || 'embedding' }}
      TF_VAR_shared_ai_account_key: ${{ secrets.SHARED_AI_ACCOUNT_KEY }}
      TF_VAR_cd_principal_object_id: ${{ vars.CD_PRINCIPAL_OBJECT_ID }}
      TF_VAR_owner_principal_object_id: ${{ vars.OWNER_PRINCIPAL_OBJECT_ID }}
      TF_VAR_act_principal_object_id: ${{ vars.ACT_PRINCIPAL_OBJECT_ID }}
      TF_VAR_extra_redirect_uris: ${{ vars.EXTRA_REDIRECT_URIS || '[]' }}
      TF_VAR_public_hostname: ${{ secrets.PUBLIC_HOSTNAME || '' }}
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
      PLAN_HASH: ${{ needs.infra-release.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the production bindings
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          TF_VAR_prefix: ${{ vars.NAME_PREFIX }}
          TF_VAR_shared_prefix: ${{ vars.SHARED_PREFIX }}
          TF_VAR_public_hostname: ${{ secrets.PUBLIC_HOSTNAME || '' }}
        run: |
          : "${ARM_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${ARM_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${ARM_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"
          : "${TFSTATE_RESOURCE_GROUP:?the demo environment must set TFSTATE_RESOURCE_GROUP}"
          : "${TFSTATE_STORAGE_ACCOUNT:?the demo environment must set TFSTATE_STORAGE_ACCOUNT}"
          : "${TF_VAR_prefix:?the demo environment must set NAME_PREFIX}"
          : "${TF_VAR_public_hostname:?the demo environment must set the PUBLIC_HOSTNAME secret}"
          : "${PLAN_HASH:?the release carried no infrastructure plan hash}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Initialise
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true"

      - name: Download the saved plan
        run: |
          az storage blob download \
            --auth-mode login \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name tfstate \
            --name tfplans/demo.tfplan \
            --file tfplan

      - name: Verify the plan matches the released hash
        run: |
          downloaded="$(sha256sum tfplan | cut -d' ' -f1)"
          if [ "$downloaded" != "$PLAN_HASH" ]; then
            echo "the saved plan does not match the hash the release recorded ($downloaded != $PLAN_HASH)" >&2
            exit 1
          fi

      - name: Apply the approved plan
        run: terraform apply -input=false tfplan

      - name: Remove the consumed plan
        if: always()
        run: |
          az storage blob delete \
            --auth-mode login \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --container-name tfstate \
            --name tfplans/demo.tfplan \
            --delete-snapshots include

  # The knowledge base follows the same discipline: staging filled and
  # retrieval-checked first, production filled only under the demo
  # environment's approval. The command is the same production fill the
  # weekly schedule runs, serialized through the same concurrency group.
  ingest-production:
    needs: [release-summary, ingest-release]
    if: needs.release-summary.result == 'success' && needs.ingest-release.result == 'success' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ingest
      cancel-in-progress: false
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the demo bindings
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${NAME_PREFIX:?the demo environment must set NAME_PREFIX}"
          : "${AZURE_CLIENT_ID:?the demo environment must set AZURE_CLIENT_ID}"
          : "${AZURE_TENANT_ID:?the demo environment must set AZURE_TENANT_ID}"
          : "${AZURE_SUBSCRIPTION_ID:?the demo environment must set AZURE_SUBSCRIPTION_ID}"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13

      - name: Fill the production index
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
        run: |
          uv sync --locked --project services/ingest
          uv run --project services/ingest ingest \
            --kb kb \
            --repo "$GITHUB_REPOSITORY" \
            --prefix "${NAME_PREFIX}"

  # Production imports the exact ZIP the release packed: the job
  # downloads the uploaded artifact, unpacks it, points the connector
  # and the deployment settings at the production host, and imports
  # that tree — it never re-packs the checked-out source. Runs under
  # the demo environment's approval.
  pp-production:
    needs: [release-summary, pp-release]
    if: needs.release-summary.result == 'success' && needs.pp-release.result == 'success' && !github.event.act
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: https://${{ env.PUBLIC_HOSTNAME }}/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pp-demo
      cancel-in-progress: false
    env:
      PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: itsupport-unmanaged
          path: out

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the host the connector should call
        env:
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
        run: |
          if [ -n "$PUBLIC_HOSTNAME" ]; then
            host="$PUBLIC_HOSTNAME"
          else
            : "${NAME_PREFIX:?the demo environment must set NAME_PREFIX (or set the PUBLIC_HOSTNAME secret)}"
            host="$(az containerapp show \
              --name "${NAME_PREFIX}-app" \
              --resource-group "${NAME_PREFIX}-rg" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
          fi
          : "${host:?no public host resolved}"
          echo "IT_SUPPORT_API_HOST=$host" >> "$GITHUB_ENV"

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Unpack the released solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1.9.2
        with:
          solution-file: out/itsupport.zip
          solution-folder: out/unpacked
          solution-type: Unmanaged

      - name: Point the connector at the production host
        env:
          API_HOST: ${{ env.IT_SUPPORT_API_HOST }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import sys

          swagger = []
          for path in glob.glob("out/unpacked/Connector/*.json"):
              with open(path) as fh:
                  doc = json.load(fh)
              if isinstance(doc, dict) and "swagger" in doc:
                  swagger.append((path, doc))
          if len(swagger) != 1:
              sys.exit(
                  "expected exactly one swagger definition in the "
                  f"unpacked Connector, found {len(swagger)}"
              )
          path, doc = swagger[0]
          doc["host"] = os.environ["API_HOST"]
          with open(path, "w") as fh:
              json.dump(doc, fh, indent=2)
              fh.write("\n")
          print("host swapped in", path)
          PY

      - name: Fill the deployment settings with the production host
        env:
          API_HOST: ${{ env.IT_SUPPORT_API_HOST }}
        run: |
          jq --arg host "$API_HOST" \
            '.EnvironmentVariables |= map(if .SchemaName == "itsup_ApiHost" then .Value = $host else . end)' \
            apps/power-platform/deployment-settings.json > out/deployment-settings.json

      - name: Pack the released tree for import
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-file: out/itsupport-import.zip
          solution-folder: out/unpacked
          solution-type: Unmanaged

      - name: Import and publish the solution
        uses: microsoft/powerplatform-actions/import-solution@v1.9.2
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          solution-file: out/itsupport-import.zip
          app-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          use-deployment-settings-file: true
          deployment-settings-file: out/deployment-settings.json
          publish-changes: true
          force-overwrite: true

      - name: Verify the connector registration in Dataverse
        env:
          ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
        run: |
          : "${ENVIRONMENT_URL:?the demo environment must set POWER_PLATFORM_ENVIRONMENT_URL}"
          token="$(az account get-access-token --resource "$ENVIRONMENT_URL" --query accessToken --output tsv)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --get --data-urlencode '$select=connectorid,name,createdon' \
            "$ENVIRONMENT_URL/api/data/v9.2/connectors" \
            | jq -r '.value[] | "connector \(.name) (\(.connectorid)) created \(.createdon)"'
