# Thin entrypoint wrapper: the original push and dispatch triggers and
# the one shared-target lease for the whole run. The reusable body
# carries no concurrency and no event triggers of its own.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "apps/web/**"
      - "contracts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "Directory.Packages.props"
      - "dotnet-tools.json"
      - "ItSupport.slnx"
      - "kb/**"
      - "services/ingest/**"
      - "infra/terraform/main/**"
      - "apps/power-platform/**"
      - ".github/workflows/**"
      - "eval/**"
      - "scripts/plan-evidence.py"
  workflow_dispatch:
    inputs:
      release_app:
        description: 'Intentionally release the app component from this ref'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One writer to the shared demo target at a time, end to end: the
  # lease spans validation, staging, evaluation, summary, the approval
  # wait and every production leg, and a second run waits instead of
  # cancelling an in-flight release.
  group: shared-target-demo
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
