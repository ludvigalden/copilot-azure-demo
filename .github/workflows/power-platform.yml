name: Power Platform

on:
  push:
    branches: [main]
    paths:
      - "apps/power-platform/**"
      - "contracts/openapi/**"
      - ".github/workflows/power-platform.yml"
  pull_request:
    paths:
      - "apps/power-platform/**"
      - "contracts/openapi/**"
      - ".github/workflows/power-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FOLDER: apps/power-platform/solution
  SOLUTION_FILE: out/itsupport.zip

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Pack the unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-folder: ${{ env.SOLUTION_FOLDER }}
          solution-file: ${{ env.SOLUTION_FILE }}
          solution-type: Unmanaged

      - uses: actions/upload-artifact@v4
        with:
          name: itsupport-unmanaged
          path: ${{ env.SOLUTION_FILE }}
          if-no-files-found: error

  import:
    needs: pack
    # Skips (green) while the environment is not configured. The gate is
    # read at job-if evaluation, which sees repository variables but not
    # environment-scoped ones; POWER_PLATFORM_ENVIRONMENT_URL therefore
    # exists both as a repository variable (this gate) and as a demo
    # environment variable (the value the steps below read).
    if: >-
      github.event_name != 'pull_request' &&
      vars.POWER_PLATFORM_ENVIRONMENT_URL != ''
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Resolve the host the connector should call
        env:
          PUBLIC_HOSTNAME: ${{ secrets.PUBLIC_HOSTNAME }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
        run: |
          if [ -n "$PUBLIC_HOSTNAME" ]; then
            host="$PUBLIC_HOSTNAME"
          else
            host="$(az containerapp show \
              --name "${NAME_PREFIX}-app" \
              --resource-group "${NAME_PREFIX}-rg" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)"
          fi
          echo "IT_SUPPORT_API_HOST=$host" >> "$GITHUB_ENV"

      - name: Point the connector at the resolved host
        run: |
          jq --arg host "$IT_SUPPORT_API_HOST" \
            '.host = $host' \
            apps/power-platform/solution/Connector/itsup_ItSupportApi_openapidefinition.json > /tmp/host-swap.json
          mv /tmp/host-swap.json apps/power-platform/solution/Connector/itsup_ItSupportApi_openapidefinition.json
          jq -r .host apps/power-platform/solution/Connector/itsup_ItSupportApi_openapidefinition.json

      - name: Fill the deployment settings with the resolved host
        run: |
          mkdir -p out
          jq --arg host "$IT_SUPPORT_API_HOST" \
            '.EnvironmentVariables |= map(if .SchemaName == "itsup_ApiHost" then .Value = $host else . end)' \
            apps/power-platform/deployment-settings.json > out/deployment-settings.json
          cat out/deployment-settings.json

      - name: Pack the unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-folder: ${{ env.SOLUTION_FOLDER }}
          solution-file: ${{ env.SOLUTION_FILE }}
          solution-type: Unmanaged

      - name: Import and publish the solution
        uses: microsoft/powerplatform-actions/import-solution@v1.9.2
        with:
          environment-url: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
          solution-file: ${{ env.SOLUTION_FILE }}
          app-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          use-deployment-settings-file: true
          deployment-settings-file: out/deployment-settings.json
          publish-changes: true
          force-overwrite: true

      - name: Verify the connector registration in Dataverse
        env:
          ENVIRONMENT_URL: ${{ vars.POWER_PLATFORM_ENVIRONMENT_URL }}
        run: |
          token="$(az account get-access-token --resource "$ENVIRONMENT_URL" --query accessToken --output tsv)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --get --data-urlencode '$select=connectorid,name,createdon' \
            "$ENVIRONMENT_URL/api/data/v9.2/connectors" \
            | jq -r '.value[] | "connector \(.name) (\(.connectorid)) created \(.createdon)"'
