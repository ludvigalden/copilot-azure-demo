name: Power Platform

on:
  pull_request:
    paths:
      - "apps/power-platform/**"
      - "contracts/openapi/**"
      - ".github/workflows/power-platform.yml"
  workflow_call:
    outputs:
      solution_version:
        value: ${{ jobs.pack.outputs.solution_version }}
      staging_status:
        value: ${{ jobs.staging-import.outputs.status }}
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FOLDER: apps/power-platform/solution
  SOLUTION_FILE: out/itsupport.zip

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      solution_version: ${{ steps.version.outputs.solution_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the solution version from the unpacked manifest
        id: version
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' \
            apps/power-platform/solution/Other/Solution.xml)"
          : "${version:?no <Version> element found in Other/Solution.xml}"
          echo "solution_version=$version" >> "$GITHUB_OUTPUT"

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Pack the unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-file: ${{ env.SOLUTION_FILE }}
          solution-folder: ${{ env.SOLUTION_FOLDER }}
          solution-type: Unmanaged

      - uses: actions/upload-artifact@v4
        with:
          name: itsupport-unmanaged
          path: ${{ env.SOLUTION_FILE }}
          if-no-files-found: error

  # The staging environment for Power Platform is not configured yet:
  # until a POWER_PLATFORM_STAGING_ENVIRONMENT_URL variable exists on
  # the staging environment, this job skips green with a message. The
  # gate reads a dedicated variable deliberately: the repository-level
  # POWER_PLATFORM_ENVIRONMENT_URL points at the production
  # environment, and a job carrying the staging environment must not
  # import into it by shadow-reading that name. TODO: functional
  # verification of the staging import — drive the connector the way
  # the production import does — once a staging environment exists to
  # verify against.
  staging-import:
    needs: pack
    outputs:
      status: ${{ steps.gate.outputs.status }}
    # Import never runs from a pull-request context: an untrusted
    # author must not reach the staging environment. workflow_call
    # keeps the caller's event, so a release push to main passes and
    # a pull request never does.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      # One import at a time per staging target: a second run must
      # queue, not cancel, since a cancelled import can leave the
      # environment half-published.
      group: pp-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: itsupport-unmanaged
          path: out

      - name: Decide whether a staging environment is configured
        id: gate
        env:
          STAGING_URL: ${{ vars.POWER_PLATFORM_STAGING_ENVIRONMENT_URL }}
        run: |
          if [ -n "$STAGING_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "status=configured" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            echo "No staging Power Platform environment is configured."
            echo "Set POWER_PLATFORM_STAGING_ENVIRONMENT_URL on the"
            echo "staging environment to enable the staging import."
          fi

      # The connector service validates the swagger host at import time
      # and does not resolve @environmentVariables(...) there, so the
      # configured path swaps a literal staging host into the checked-out
      # source tree and packs its own zip for import. The shared
      # unmanaged artifact keeps the environment-variable host and is
      # never imported here. The host variable is dedicated for the same
      # reason the gate's URL variable is: the repository-level names
      # point at the production environment and must not be shadow-read.
      - name: Resolve the staging API host for the connector
        if: steps.gate.outputs.configured == 'true'
        env:
          API_HOST: ${{ vars.POWER_PLATFORM_STAGING_API_HOST }}
        run: |
          : "${API_HOST:?the staging environment must set POWER_PLATFORM_STAGING_API_HOST}"
          echo "IT_SUPPORT_API_HOST=$API_HOST" >> "$GITHUB_ENV"

      - uses: azure/login@v2
        if: steps.gate.outputs.configured == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: microsoft/powerplatform-actions/actions-install@v1.9.2
        if: steps.gate.outputs.configured == 'true'

      - name: Point the connector at the staging host
        if: steps.gate.outputs.configured == 'true'
        env:
          API_HOST: ${{ env.IT_SUPPORT_API_HOST }}
        run: |
          python3 scripts/swap-connector-host.py \
            --host "$API_HOST" \
            --solution-folder "$SOLUTION_FOLDER"

      - name: Pack the staging solution
        if: steps.gate.outputs.configured == 'true'
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-file: out/itsupport-staging.zip
          solution-folder: ${{ env.SOLUTION_FOLDER }}
          solution-type: Unmanaged

      - name: Import and publish the solution to staging
        if: steps.gate.outputs.configured == 'true'
        uses: microsoft/powerplatform-actions/import-solution@v1.9.2
        with:
          environment-url: ${{ vars.POWER_PLATFORM_STAGING_ENVIRONMENT_URL }}
          solution-file: out/itsupport-staging.zip
          app-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          publish-changes: true
          force-overwrite: true
